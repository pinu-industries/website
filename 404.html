<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Pinu Industries</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/logos/pinu-favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Sora:wght@600&display=swap">
  <style>
    /* GitHub Pages sirve esta página desde cualquier ruta: por eso las rutas son absolutas
       y el enlace de regreso apunta a la raíz del dominio. */
    :root { --deep-2: #00180F; --bright: #00D26F; --flash: #7DFFBE; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(90% 70% at 50% 30%, #00331F, var(--deep-2) 70%) var(--deep-2);
      color: #fff; font-family: "IBM Plex Sans", system-ui, sans-serif; text-align: center;
    }
    img { width: 120px; height: auto; margin: 0 auto 32px; display: block; }
    h1 { font-family: "Sora", system-ui, sans-serif; font-weight: 600; letter-spacing: -0.04em; font-size: clamp(2rem, 1rem + 5vw, 4rem); line-height: 1; margin: 0; }
    p { color: rgba(255,255,255,.72); margin: 16px 0 32px; font-size: 1.1rem; }
    a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 1.5em; border-radius: 999px; background: var(--bright); color: var(--deep-2); font-family: "Sora", system-ui, sans-serif; font-weight: 600; text-decoration: none; }
    a:hover { background: var(--flash); }
    a:focus-visible { outline: 3px solid var(--flash); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/logos/pinu-isotipo-flat.svg" alt="Pinu Industries" width="795" height="622">
    <h1>Esta página no existe.</h1>
    <p>Pero tu negocio sí, y lo podemos ordenar.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
